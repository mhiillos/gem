version: 2

models:
  - name: dim_items
    description: "Dim table for items metadata"
    columns:
      - name: item_id
        data_tests:
          - unique
          - not_null
      - name: name
        data_tests:
          - not_null
  - name: fct_prices
    description: "Fact table, one row per item per hour"
    columns:
      - name: price_id
        data_tests:
          - unique
          - not_null
      - name: item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_items')
                field: item_id
              config:
                severity: warn
      - name: high_price
        description: "Average instant-buy price"
      - name: low_price
        description: "Average instant-sell price"
      - name: high_price_avg_24h
        description: "High price average over volume of past 24h window"
      - name: low_price_avg_24h
        description: "Low price average over volume of past 24h window"
      - name: total_volume_24h
        description: "Total volume traded over past 24h window"
      - name: mean_price
        description: "Volume-weighted mean price"
  - name: fct_prices_daily
    description: "Fact table, one row per item per UTC day, with day-over-day changes"
    columns:
      - name: price_day_id
        data_tests:
          - unique
          - not_null
      - name: item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_items')
                field: item_id
              config:
                severity: warn
  - name: mart_items_latest
    description: "One row per item in dim_items"
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('dim_items')
    columns:
      - name: item_id
        data_tests:
          - unique
          - not_null
      - name: high_price_at
        description: "the hour of the latest recorded high_price where the item was traded"
      - name: low_price_at
        description: "the hour of the latest recorded low_price where the item was traded"
      - name: spread
        description: "Difference of high_price and low_price, null when the latest prices are not from the same hour"

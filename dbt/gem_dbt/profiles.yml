gem_dbt:
  outputs:
    dev:
      dbname: "{{ env_var('PGDATABASE') }}"
      host: "{{ env_var('PGHOST') }}"
      pass: "{{ env_var('PGPASSWORD') }}"
      port: "{{ env_var('PGPORT') | as_number }}"
      schema: dev
      threads: 1
      type: postgres
      user: "{{ env_var('PGUSER') }}"
  target: dev
